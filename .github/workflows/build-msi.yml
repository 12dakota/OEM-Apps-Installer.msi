name: Build MSI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  msi:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Stage apps.zip into WiX payload
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path msi/payload | Out-Null
          $found = $null
          if ((Test-Path apps.zip) -and ((Get-Item apps.zip).Length -gt 0)) { $found = "apps.zip" }
          elseif ((Test-Path msi/payload/apps.zip) -and ((Get-Item msi/payload/apps.zip).Length -gt 0)) { $found = "msi/payload/apps.zip" }
          if (-not $found) { throw "apps.zip missing. Upload apps.zip to the repo root." }
          if ($found -ne "msi/payload/apps.zip") { Copy-Item $found msi/payload/apps.zip -Force }
          Write-Host "Using payload $((Get-Item msi/payload/apps.zip).Length) bytes from $found"

      - name: Publish extract custom action
        run: dotnet publish msi/ExtractToWindowsApps.csproj -c Release -o msi/out-ca

      - name: Publish installer window
        run: dotnet publish ui/InstallerWindow.csproj -c Release -o usb

      - name: Install WiX
        run: dotnet tool install --global wix --version 5.0.2

      - name: Build USB-portable MSI
        shell: pwsh
        run: |
          $env:PATH = "$env:USERPROFILE\.dotnet\tools;$env:PATH"
          New-Item -ItemType Directory -Force -Path msi/out, usb | Out-Null
          wix build msi/Package.wxs -o msi/out/OEM-Apps-Installer.msi -bindpath payload=msi/payload -bindpath ca=msi/out-ca
          Copy-Item msi/out/OEM-Apps-Installer.msi usb/OEM-Apps-Installer.msi -Force

      - name: Upload MSI artifact
        uses: actions/upload-artifact@v4
        with:
          name: OEM-Apps-Installer-usb
          path: |
            usb/OEM-Apps-Installer.msi
            usb/OEMAppsInstallerUI.exe
            usb/Install-from-USB.cmd
            usb/autorun.inf

      - name: Attach MSI to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: usb/OEM-Apps-Installer.msi
